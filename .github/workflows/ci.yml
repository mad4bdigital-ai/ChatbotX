name: Stop-on-reply format pass

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-stop-on-reply:
    name: Format stop-on-reply patch
    if: github.event_name == 'pull_request' && github.head_ref == '001-whatsapp-growth-crm-gap-closure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2

      - name: Fail closed on exact feature parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "ccc3d1f96b62edd49f0ce53dae81a3b6ddf093cf"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format stop-on-reply TypeScript
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec biome format --write \
            apps/worker/src/integration/handlers/received-message.ts \
            apps/worker/src/integration/handlers/sequence-stop-on-reply.ts \
            apps/worker/__tests__/sequence-stop-on-reply.test.ts \
            packages/business/src/contact-sequence/service.ts \
            packages/database/src/schema/sequence.ts
          pnpm exec biome check \
            apps/worker/src/integration/handlers/received-message.ts \
            apps/worker/src/integration/handlers/sequence-stop-on-reply.ts \
            apps/worker/__tests__/sequence-stop-on-reply.test.ts \
            packages/business/src/contact-sequence/service.ts \
            packages/database/src/schema/sequence.ts
          git diff --check

      - name: Commit formatted source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MAD4B"
          git config user.email "mad4b.digital@gmail.com"
          git add \
            apps/worker/src/integration/handlers/received-message.ts \
            apps/worker/src/integration/handlers/sequence-stop-on-reply.ts \
            apps/worker/__tests__/sequence-stop-on-reply.test.ts \
            packages/business/src/contact-sequence/service.ts \
            packages/database/src/schema/sequence.ts
          if git diff --cached --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git commit -m "style(growth-crm): format stop-on-reply implementation"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
