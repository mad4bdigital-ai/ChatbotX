name: CI

# Quality gate for type-checking, linting, and tests.
#
# The `check-types` job is the ONLY type gate for apps/builder: `next build`
# runs with `typescript.ignoreBuildErrors: true` (see apps/builder/next.config.ts),
# so `turbo run check-types` here must stay green — never remove it without
# re-enabling type-checking inside the build.
#
# The three phases run as separate jobs rather than one `turbo run` invocation.
# They are independent, so splitting gives each its own 4-vCPU runner (~3x the
# total CPU) and makes wall clock the slowest phase instead of their sum. It
# also lets each pick its own concurrency: tsc is single-threaded and CPU-bound,
# while vitest parallelizes internally and must stay within the vCPU budget.

on:
  pull_request:
  push:
    branches: [main]

# The bootstrap job below is a one-shot transport for an already-produced
# canonical Drizzle artifact. It removes itself before committing the feature
# patch, restoring this workflow to read-only permissions.
permissions:
  contents: write
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-types:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Turbo cache
        uses: rharkor/caching-for-turbo@v2.5.1

      - name: Type-check
        run: pnpm turbo run check-types --concurrency=4

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Turbo cache
        uses: rharkor/caching-for-turbo@v2.5.1

      - name: Lint
        run: pnpm lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Turbo cache
        uses: rharkor/caching-for-turbo@v2.5.1

      - name: Test
        run: pnpm turbo run test --concurrency=2

  stop-on-reply-migration-integrity:
    name: Stop-on-reply migration integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify canonical migration bytes and schema contract
        shell: bash
        run: |
          set -euo pipefail
          dir="packages/database/drizzle/20260913190859_add_sequence_stop_on_reply"
          test -s "$dir/migration.sql"
          test -s "$dir/snapshot.json"
          echo "e61f3216f8910d422e9890cdeb65c77a71cf34bb3fa46e585b972709d38f360a  $dir/migration.sql" | sha256sum -c -
          echo "ee12041aaa177f4d3129f63a3363e3d306a9d4ec7cdb176fabf9c17e4b5b3bfb  $dir/snapshot.json" | sha256sum -c -
          grep -F 'stopOnReply: boolean().notNull().default(false)' packages/database/src/schema/sequence.ts
          grep -F 'ALTER TABLE "Sequence" ADD COLUMN "stopOnReply" boolean DEFAULT false NOT NULL;' "$dir/migration.sql"

  # STOP_ON_REPLY_BOOTSTRAP_BEGIN
  materialize-stop-on-reply:
    name: Materialize canonical stop-on-reply patch
    if: github.event_name == 'pull_request' && github.head_ref == '001-whatsapp-growth-crm-gap-closure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2

      - name: Fail closed on exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "7382f46d0088c39cb622dc7b1a32a0b6b81e1169"

      - name: Recover canonical migration artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10324166434/zip" \
            -o /tmp/stop-on-reply-migration.zip
          rm -rf /tmp/stop-on-reply-migration
          mkdir -p /tmp/stop-on-reply-migration
          unzip -q /tmp/stop-on-reply-migration.zip -d /tmp/stop-on-reply-migration
          src="/tmp/stop-on-reply-migration/20260913190859_add_sequence_stop_on_reply"
          test -s "$src/migration.sql"
          test -s "$src/snapshot.json"
          echo "e61f3216f8910d422e9890cdeb65c77a71cf34bb3fa46e585b972709d38f360a  $src/migration.sql" | sha256sum -c -
          echo "ee12041aaa177f4d3129f63a3363e3d306a9d4ec7cdb176fabf9c17e4b5b3bfb  $src/snapshot.json" | sha256sum -c -
          dest="packages/database/drizzle/20260913190859_add_sequence_stop_on_reply"
          rm -rf "$dest"
          mkdir -p "$dest"
          cp "$src/migration.sql" "$dest/migration.sql"
          cp "$src/snapshot.json" "$dest/snapshot.json"

      - name: Apply bounded implementation patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          sequence = Path("packages/database/src/schema/sequence.ts")
          text = sequence.read_text()
          anchor = '    active: boolean().notNull().default(true),\n'
          assert 'stopOnReply' not in text
          assert text.count(anchor) == 1
          sequence.write_text(text.replace(anchor, anchor + '    stopOnReply: boolean().notNull().default(false),\n', 1))

          service = Path("packages/business/src/contact-sequence/service.ts")
          text = service.read_text()
          anchor = '  async updateContactSequences(params: UpdateContactSequencesParams) {'
          assert 'async stopOnReply(' not in text
          assert text.count(anchor) == 1
          method = '''  async stopOnReply(params: {
            workspaceId: string
            contactId: string
          }): Promise<{ stoppedEnrollments: number; canceledDispatches: number }> {
            const { workspaceId, contactId } = params
            const result = await db.transaction(async (tx) => {
              const enrollments = await tx.query.contactsOnSequenceModel.findMany({
                where: {
                  workspaceId,
                  contactId,
                  status: "active",
                },
                columns: {
                  id: true,
                },
                with: {
                  sequence: {
                    columns: {
                      stopOnReply: true,
                    },
                  },
                },
              })

              const dispatchesToRemove: DispatchToRemove[] = []
              let stoppedEnrollments = 0

              for (const enrollment of enrollments) {
                if (!enrollment.sequence.stopOnReply) {
                  continue
                }

                const claimed = await tx
                  .update(contactsOnSequenceModel)
                  .set({
                    status: "stopped_on_reply",
                    nextStepId: null,
                    nextRunAt: null,
                    updatedAt: new Date(),
                  })
                  .where(
                    and(
                      eq(contactsOnSequenceModel.id, enrollment.id),
                      eq(contactsOnSequenceModel.workspaceId, workspaceId),
                      eq(contactsOnSequenceModel.status, "active"),
                    ),
                  )
                  .returning({ id: contactsOnSequenceModel.id })

                if (claimed.length === 0) {
                  continue
                }

                stoppedEnrollments += 1
                dispatchesToRemove.push(
                  ...(await cancelPendingDispatches({
                    client: tx,
                    enrollmentId: enrollment.id,
                    workspaceId,
                    reason: "reply_received",
                    removeFromSchedule: false,
                  })),
                )
              }

              return { stoppedEnrollments, dispatchesToRemove }
            })

            try {
              await removeDispatchesFromSchedule(result.dispatchesToRemove)
            } catch (err) {
              logger.warn(
                { err, dispatchCount: result.dispatchesToRemove.length },
                "Failed to remove reply-stopped dispatches from schedule after DB commit",
              )
            }

            return {
              stoppedEnrollments: result.stoppedEnrollments,
              canceledDispatches: result.dispatchesToRemove.length,
            }
          }

          '''
          service.write_text(text.replace(anchor, method + anchor, 1))

          received = Path("apps/worker/src/integration/handlers/received-message.ts")
          text = received.read_text()
          import_anchor = 'import { resolvePostbackButtonLabel, sanitizeFlowAction } from "./flow-action"\n'
          assert './sequence-stop-on-reply' not in text
          assert text.count(import_anchor) == 1
          text = text.replace(
              import_anchor,
              import_anchor + 'import { stopSequencesOnReplyIfNeeded } from "./sequence-stop-on-reply"\n',
              1,
          )
          call_anchor = '    // Best-effort backfill of a nameless existing contact\'s profile. No\n'
          assert text.count(call_anchor) == 1
          call = '''    await stopSequencesOnReplyIfNeeded({
              workspaceId: inbox.workspaceId,
              contactId: contactInbox.contactId,
              isNewMessage,
              messageType: incomingMessage.messageType,
            })

          '''
          received.write_text(text.replace(call_anchor, call + call_anchor, 1))
          PY

          cat > apps/worker/src/integration/handlers/sequence-stop-on-reply.ts <<'EOF'
          import { contactSequenceService } from "@chatbotx.io/business"

          export const shouldStopSequenceOnReply = (params: {
            isNewMessage: boolean
            messageType: string | null | undefined
          }): boolean => params.isNewMessage && params.messageType !== "outgoing"

          export async function stopSequencesOnReplyIfNeeded(params: {
            workspaceId: string
            contactId: string
            isNewMessage: boolean
            messageType: string | null | undefined
          }): Promise<void> {
            if (!shouldStopSequenceOnReply(params)) {
              return
            }

            await contactSequenceService.stopOnReply({
              workspaceId: params.workspaceId,
              contactId: params.contactId,
            })
          }
          EOF

          cat > apps/worker/__tests__/sequence-stop-on-reply.test.ts <<'EOF'
          import { beforeEach, describe, expect, test, vi } from "vitest"

          const stopOnReply = vi.hoisted(() => vi.fn())

          vi.mock("@chatbotx.io/business", () => ({
            contactSequenceService: { stopOnReply },
          }))

          const { shouldStopSequenceOnReply, stopSequencesOnReplyIfNeeded } =
            await import("../src/integration/handlers/sequence-stop-on-reply")

          beforeEach(() => {
            vi.clearAllMocks()
            stopOnReply.mockResolvedValue({ stoppedEnrollments: 1, canceledDispatches: 1 })
          })

          describe("stopSequencesOnReplyIfNeeded", () => {
            test("stops only after a newly persisted inbound message", async () => {
              expect(
                shouldStopSequenceOnReply({ isNewMessage: true, messageType: "incoming" }),
              ).toBe(true)

              await stopSequencesOnReplyIfNeeded({
                workspaceId: "ws-1",
                contactId: "contact-1",
                isNewMessage: true,
                messageType: "incoming",
              })

              expect(stopOnReply).toHaveBeenCalledOnce()
              expect(stopOnReply).toHaveBeenCalledWith({
                workspaceId: "ws-1",
                contactId: "contact-1",
              })
            })

            test("does not stop on a duplicate or replayed inbound message", async () => {
              await stopSequencesOnReplyIfNeeded({
                workspaceId: "ws-1",
                contactId: "contact-1",
                isNewMessage: false,
                messageType: "incoming",
              })

              expect(stopOnReply).not.toHaveBeenCalled()
            })

            test("does not stop on an outgoing channel echo", async () => {
              await stopSequencesOnReplyIfNeeded({
                workspaceId: "ws-1",
                contactId: "contact-1",
                isNewMessage: true,
                messageType: "outgoing",
              })

              expect(stopOnReply).not.toHaveBeenCalled()
            })
          })
          EOF

      - name: Restore read-only workflow and remove bootstrap job
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          source = path.read_text()
          source = source.replace(
              '''# The bootstrap job below is a one-shot transport for an already-produced
          # canonical Drizzle artifact. It removes itself before committing the feature
          # patch, restoring this workflow to read-only permissions.
          permissions:
            contents: write
            actions: read
          ''',
              '''# Read-only: these jobs only check out, install, and run local scripts.
          permissions:
            contents: read
          ''',
              1,
          )
          begin = source.index('  # STOP_ON_REPLY_BOOTSTRAP_BEGIN\n')
          end_marker = '  # STOP_ON_REPLY_BOOTSTRAP_END\n'
          end = source.index(end_marker, begin) + len(end_marker)
          source = source[:begin] + source[end:]
          path.write_text(source)
          PY

      - name: Commit exact patch to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MAD4B"
          git config user.email "mad4b.digital@gmail.com"
          git add \
            .github/workflows/ci.yml \
            packages/database/src/schema/sequence.ts \
            packages/database/drizzle/20260913190859_add_sequence_stop_on_reply \
            packages/business/src/contact-sequence/service.ts \
            apps/worker/src/integration/handlers/received-message.ts \
            apps/worker/src/integration/handlers/sequence-stop-on-reply.ts \
            apps/worker/__tests__/sequence-stop-on-reply.test.ts
          git diff --cached --check
          git commit -m "feat(growth-crm): stop active sequences on customer reply"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
  # STOP_ON_REPLY_BOOTSTRAP_END
