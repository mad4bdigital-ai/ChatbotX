name: Test diagnostics

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-diagnostics-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture-test-output:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == '001-whatsapp-growth-crm-gap-closure'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Turbo cache
        uses: rharkor/caching-for-turbo@v2.5.1

      - name: Run tests and capture output
        shell: bash
        run: |
          set -o pipefail
          pnpm turbo run test --concurrency=2 2>&1 | tee test-output.txt

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ github.run_id }}
          path: test-output.txt
          if-no-files-found: error
